name: Proton.ai
description: 'Proton.ai is an AI-powered industry cloud platform for wholesale and B2B distributors.
  It connects and centralizes a distributor''s customer, product, and transactional data across
  disparate systems, then applies deep-learning models to produce real-time product recommendations,
  automate CRM and e-commerce workflows, enrich product data, and streamline order and quote
  processing. Proton.ai exposes an AI REST API (documented via Postman at api.proton.ai) that
  returns product recommendations and performs actions inside the Proton platform, authenticated
  with a static API key supplied in the request header. The company is based in Boston and raised
  a $20M Series A led by Felicis Ventures. This profile was surfaced as a VC-portfolio lead and
  enriched by the API Evangelist pipeline.'
